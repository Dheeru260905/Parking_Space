<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enter Vehicle Numbers</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f1f4f8;
      margin: 0;
      padding-top: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: linear-gradient(to right, #339af0, #1c7ed6);
      color: white;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .nav-buttons {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }

    .nav-buttons a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-buttons a:hover {
      color: #d0ebff;
    }

    form {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      width: 400px;
      max-width: 90%;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1c7ed6;
    }

    .vehicle-input {
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #339af0;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1c7ed6;
    }

    .no-slots {
      text-align: center;
      font-size: 16px;
      color: #555;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Enter Vehicle Numbers</h1>
    <div class="nav-buttons">
      <a href="home.html">Home</a>
      <a href="available-spots.html">Available Spots</a>
    </div>
  </header>

  <form id="vehicleForm" onsubmit="handleSubmit(event)">
    <h2>Vehicle Details</h2>
    <div id="inputContainer"></div>
    <button type="submit">Confirm Booking</button>
  </form>

  <script>
    const selectedSlots = JSON.parse(localStorage.getItem("selectedSlots"));
    const inputContainer = document.getElementById("inputContainer");

    if (!selectedSlots || selectedSlots.length === 0) {
      inputContainer.innerHTML = "<p class='no-slots'>No slots selected. Please go back and select a slot.</p>";
    } else {
      selectedSlots.forEach(slotId => {
        const div = document.createElement("div");
        div.className = "vehicle-input";
        div.innerHTML = `
          <label for="vehicle-${slotId}">Slot ${slotId} - Vehicle Number:</label>
          <input type="text" id="vehicle-${slotId}" name="vehicle-${slotId}" required placeholder="e.g., KA01AB1234">
        `;
        inputContainer.appendChild(div);
      });
    }

    function handleSubmit(event) {
      event.preventDefault();

      const vehicleNumbers = {};
      let allFilled = true;

      selectedSlots.forEach(slotId => {
        const input = document.getElementById(`vehicle-${slotId}`);
        const value = input.value.trim();
        if (value === "") {
          allFilled = false;
        }
        vehicleNumbers[slotId] = value;
      });

      if (!allFilled) {
        alert("Please fill in all vehicle numbers.");
        return;
      }

      const history = JSON.parse(localStorage.getItem("parkingHistory")) || [];
      const now = new Date();
      const timestamp = now.toLocaleString();

      Object.entries(vehicleNumbers).forEach(([slotId, vehicleNumber]) => {
        history.push({
          vehicleNumber,
          date: timestamp
        });
      });

      localStorage.setItem("parkingHistory", JSON.stringify(history));
      localStorage.removeItem("selectedSlots");

      window.location.href = "parking-history.html";
    }
  </script>
<script src="firebase-init.js"></script>
</body>
</html>
